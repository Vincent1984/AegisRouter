# AegisRouter - 模型参数声明 (用于能力评分与路由区间计算)
# 系统根据以下参数自动计算 computed_score 和 score_range

models:
  # === 本地模型 ===
  - name: local-7b
    litellm_model: ollama/qwen2.5-7b
    provider: local
    params:
      parameter_size_b: 7
      context_window: 32000
      benchmark_mmlu: 65.0
      benchmark_humaneval: 45.0
      benchmark_math: 40.0
      cost_per_1m_input: 0.0
      cost_per_1m_output: 0.0
      latency_avg_ms: 200
      supports_streaming: true
      supports_function_call: false

  # === DeepSeek ===
  - name: deepseek-v4-pro
    litellm_model: deepseek/deepseek-v4-pro
    provider: deepseek
    params:
      parameter_size_b: 671
      context_window: 128000
      benchmark_mmlu: 90.2
      benchmark_humaneval: 88.5
      benchmark_math: 82.0
      cost_per_1m_input: 0.27
      cost_per_1m_output: 1.10
      latency_avg_ms: 800
      supports_streaming: true
      supports_function_call: true

  # === Claude (Anthropic) ===
  - name: claude-sonnet
    litellm_model: anthropic/claude-sonnet-4-20250514
    provider: anthropic
    params:
      parameter_size_b: null
      context_window: 200000
      benchmark_mmlu: 89.5
      benchmark_humaneval: 92.0
      benchmark_math: 80.5
      cost_per_1m_input: 3.00
      cost_per_1m_output: 15.00
      latency_avg_ms: 700
      supports_streaming: true
      supports_function_call: true

