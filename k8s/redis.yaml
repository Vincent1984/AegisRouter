apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aegis-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          command: ["redis-server"]
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: aegis-router
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
